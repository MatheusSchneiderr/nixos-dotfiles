[*]
ctx-size = 65536 
batch-size = 4096
ubatch-size = 2048
n-gpu-layers = 99
threads = 8
flash-attn = on
load-on-startup = false
chat-template-file = /home/schneider/nixos-dotfiles/llm-ctl/isvalorum-chat-template.jinja

#README: mmproj are vision models for images. By default I disable them on coding models.
#I let it on for qwen3.8 (general purpose) and ornith-debugger can benefit from it too

[tiel-coder]
model = /home/schneider/models/gguf/Tiel-Coder-35B-A3B.APEX-I-MiniPlus-V2.1.gguf
#mmproj = /home/schneider/models/gguf/vision/tiel-coder-mmproj-Q8_0.gguf
parallel = 1
temp = 0.2
#production is 0.3 top-k 20 but im testing more deterministic
top-k = 15
top-p = 0.95
min-p = 0.05

[general-purpose-qwen3.8]
model = /home/schneider/models/gguf/Qwen3.8-35B-A3B-Distill.APEX-I-MiniPlus-V2.1.gguf
mmproj = /home/schneider/models/gguf/vision/qwen3.8-mmproj-Q8_0.gguf
parallel = 1
temp = 0.5
top-p = 0.95
top-k = 20
min-p = 0.05
typical-p = 0.95

#just insert any of the NanoPlus models here. theyre about 2gb smaller and much faster
#I use more deterministic samplers to avoid hallucinations. Go straight to the point in the prompts
[fast]
model = /home/schneider/models/gguf/nanoplus/Tiel-Coder-35B-A3B.APEX-I-NanoPlus.gguf
parallel = 1
temp = 0.2
min-p = 0.05
top-p = 0.95
top-k = 15 
