set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -s extended-keys on
set -as terminal-features ",foot*:extkeys"
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# status-right must be set before TPM loads continuum, or it overwrites the autosave hook
set -g status-right '%H:%M %d-%b-%y'

bind k switch-client -T respawn
bind -T respawn a respawn-pane -k
bind K switch-client -T respawn-all
bind -T respawn-all A run-shell 'tmux list-panes -s -F "##{pane_id}" | xargs -I{} tmux respawn-pane -k -t {}'
bind -n C-BSpace send-keys C-w
bind -n C-h send-keys C-w
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind s display-popup -E -w 80% -h 70% "sesh picker -t -c"

# Theme (base16 isotope)
set -g status-style "fg=#d0d0d0,bg=#000000"
setw -g window-status-style "fg=#d0d0d0,bg=#000000"
setw -g window-status-current-style "fg=#ff0099,bg=#000000"
set -g pane-border-style "fg=#404040"
set -g pane-active-border-style "fg=#c0c0c0"
set -g message-style "fg=#e0e0e0,bg=#404040"
set -g message-command-style "fg=#e0e0e0,bg=#404040"
set -g display-panes-active-colour "#c0c0c0"
set -g display-panes-colour "#404040"
setw -g clock-mode-colour "#0066ff"
setw -g mode-style "fg=#c0c0c0,bg=#404040"
setw -g window-status-bell-style "fg=#000000,bg=#ff0000"
setw -g window-status-activity-style "fg=#d0d0d0,bg=#000000"

# Plugins (TPM): prefix + I installs, prefix + U updates
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwlchan/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-processes 'claude opencode lazygit'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
