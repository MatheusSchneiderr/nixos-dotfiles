[default_session]
startup_command = "tmux rename-window agent && claude --dangerously-skip-permissions"
windows = ["code", "run"]

[[window]]
name = "agent"
startup_script = "claude --dangerously-skip-permissions"

[[window]]
name = "code"
startup_script = "nvim"

[[window]]
name = "run"

[[wildcard]]
pattern = "~/job/*"
windows = ["code", "run"]

[[wildcard]]
pattern = "~/projects/**"
windows = ["code", "run"]

[[wildcard]]
pattern = "~/nixos-dotfiles"
windows = ["code", "run"]
