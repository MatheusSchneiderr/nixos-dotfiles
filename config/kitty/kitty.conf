enable_audio_bell no
confirm_os_window_close 0
cursor_shape block
allow_remote_control yes 
# ^^^ this is for session management

# Animated gliding cursor.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1

# Stock new_tab/new_window/new_os_window don't inherit the current pane's
# cwd - the _with_cwd variants do.
map ctrl+backspace send_text all \x17
map shift+enter send_text all \x1b\r
map kitty_mod+t new_tab_with_cwd
map kitty_mod+enter new_window_with_cwd
map kitty_mod+n new_os_window_with_cwd

# Colors: base16 "Default Dark" placeholder hexes below, swapped for the live
# Stylix base16 scheme at build time (see default.nix). Mirrors the mapping
# Stylix's own kitty target would otherwise generate via tinted-kitty.
background #181818
foreground #d8d8d8
selection_background #383838
selection_foreground #d8d8d8

cursor #d8d8d8
cursor_text_color #181818

url_color #b8b8b8

active_border_color #383838
inactive_border_color #282828

wayland_titlebar_color #181818
macos_titlebar_color #181818

active_tab_background #181818
active_tab_foreground #d8d8d8
inactive_tab_background #282828
inactive_tab_foreground #b8b8b8
tab_bar_background #282828

